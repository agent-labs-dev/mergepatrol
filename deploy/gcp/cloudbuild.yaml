# Builds both images and deploys Mergepatrol's one environment: the orchestrator as the Cloud
# Run service `mergepatrol`, and the rebase job as the Cloud Run Job `mergepatrol-job`, which the
# orchestrator runs once per job. deploy/gcp/bootstrap.sh sets up what this needs.
substitutions:
  _REGION: us-west1
  _PUBLIC_URL: https://merge.bugpatrol.ai
  _REPO: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/mergepatrol
options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
  env: [DOCKER_BUILDKIT=1]
steps:
  - id: orchestrator
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=orchestrator
      - --tag=${_REPO}/orchestrator:${BUILD_ID}
      - .
  - id: job
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=job
      - --tag=${_REPO}/job:${BUILD_ID}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [orchestrator, job]
    args:
      - push
      - --all-tags
      - ${_REPO}/orchestrator
  - id: push-job
    name: gcr.io/cloud-builders/docker
    waitFor: [orchestrator, job]
    args:
      - push
      - --all-tags
      - ${_REPO}/job

  # The job before the orchestrator: a new orchestrator may send a job what only a new job reads.
  # No retries: the orchestrator decides what a failed job means.
  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-job]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - mergepatrol-job
      - --region=${_REGION}
      - --image=${_REPO}/job:${BUILD_ID}
      - --service-account=mergepatrol-job@${PROJECT_ID}.iam.gserviceaccount.com
      - --tasks=1
      - --max-retries=0
      - --task-timeout=2400s
      - --cpu=4
      - --memory=8Gi

  # One instance, always on: the queue runs in the background, not per request, and two
  # instances would run every queue twice. The repo caches live in memory, hence 4Gi.
  - id: deploy-orchestrator
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push, deploy-job]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mergepatrol
      - --region=${_REGION}
      - --image=${_REPO}/orchestrator:${BUILD_ID}
      - --service-account=mergepatrol@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --cpu=2
      - --memory=4Gi
      - --port=8080
      - --add-cloudsql-instances=${PROJECT_ID}:${_REGION}:mergepatrol
      - --set-secrets=MERGEPATROL_DATABASE_URL=mergepatrol-database-url:latest,MERGEPATROL_SECRET_KEY=mergepatrol-secret-key:latest
      - --set-env-vars=MERGEPATROL_PUBLIC_URL=${_PUBLIC_URL},MERGEPATROL_EXECUTOR=cloud-run,MERGEPATROL_CLOUD_RUN_JOB=projects/${PROJECT_ID}/locations/${_REGION}/jobs/mergepatrol-job
