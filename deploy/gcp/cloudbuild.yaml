# Builds both images and deploys Mergepatrol's one environment: the orchestrator as the Cloud
# Run service `mergepatrol`, and the rebase job as the Cloud Run Job `mergepatrol-job`, which the
# orchestrator runs once per job. deploy/gcp/bootstrap.sh sets up what this needs.
substitutions:
  _REGION: us-west1
  _PUBLIC_URL: https://mergepatrol.ai
  # The PostHog project `mergepatrol`, in the agent-labs organization. Public: browsers send it.
  _POSTHOG_KEY: phc_kw3KfV5JfjGbGjoZ4CHDNEyE4NePf8g5c5xJsJJNDtqT
  # The live Stripe price per seat, in the product `Mergepatrol`. Not secret.
  _STRIPE_PRICE: price_1UVzi1PwOsXo1dyk78nfPqCb
  _REPO: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/mergepatrol
options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
  env: [DOCKER_BUILDKIT=1]
steps:
  - id: orchestrator
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=orchestrator
      - --tag=${_REPO}/orchestrator:${BUILD_ID}
      - .
  - id: job
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=job
      - --tag=${_REPO}/job:${BUILD_ID}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [orchestrator, job]
    args:
      - push
      - --all-tags
      - ${_REPO}/orchestrator
  - id: push-job
    name: gcr.io/cloud-builders/docker
    waitFor: [orchestrator, job]
    args:
      - push
      - --all-tags
      - ${_REPO}/job

  # The job before the orchestrator: a new orchestrator may send a job what only a new job reads.
  # No retries: the orchestrator decides what a failed job means.
  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-job]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - mergepatrol-job
      - --region=${_REGION}
      - --image=${_REPO}/job:${BUILD_ID}
      - --service-account=mergepatrol-job@${PROJECT_ID}.iam.gserviceaccount.com
      - --tasks=1
      - --max-retries=0
      - --task-timeout=2400s
      - --cpu=4
      - --memory=8Gi

  # Cloud Run imports a job's new image on its first execution, which held the first rebase
  # after each deploy for 20 to 45 seconds. This no-op execution takes that wait instead.
  - id: warm-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy-job]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - mergepatrol-job
      - --region=${_REGION}
      - --args=--version
      - --wait

  # One instance, always on: the queue runs in the background, not per request. A second one,
  # as during a deploy, serves requests and waits for the queue lock in Postgres. The repo
  # caches live in memory, hence 4Gi.
  # Public without an allUsers binding, which the org's domain-restricted sharing refuses.
  - id: deploy-orchestrator
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push, warm-job]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mergepatrol
      - --region=${_REGION}
      - --image=${_REPO}/orchestrator:${BUILD_ID}
      - --service-account=mergepatrol@${PROJECT_ID}.iam.gserviceaccount.com
      - --no-invoker-iam-check
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      # A job's model API calls stream through the orchestrator, and one can outlast the
      # default 300s request timeout.
      - --timeout=3600
      - --cpu=2
      - --memory=4Gi
      - --port=8080
      - --add-cloudsql-instances=${PROJECT_ID}:${_REGION}:mergepatrol
      # The hosted GitHub App, from deploy/gcp/hosted-app.sh.
      - >-
        --set-secrets=MERGEPATROL_DATABASE_URL=mergepatrol-database-url:latest,MERGEPATROL_SECRET_KEY=mergepatrol-secret-key:latest,MERGEPATROL_GITHUB_APP_ID=mergepatrol-github-app-id:latest,MERGEPATROL_GITHUB_APP_PRIVATE_KEY=mergepatrol-github-app-private-key:latest,MERGEPATROL_GITHUB_CLIENT_ID=mergepatrol-github-client-id:latest,MERGEPATROL_GITHUB_CLIENT_SECRET=mergepatrol-github-client-secret:latest,MERGEPATROL_GITHUB_WEBHOOK_SECRET=mergepatrol-github-webhook-secret:latest,MERGEPATROL_STRIPE_SECRET_KEY=mergepatrol-stripe-secret-key:latest,MERGEPATROL_STRIPE_WEBHOOK_SECRET=mergepatrol-stripe-webhook-secret:latest
      - --set-env-vars=MERGEPATROL_PUBLIC_URL=${_PUBLIC_URL},MERGEPATROL_EXECUTOR=cloud-run,MERGEPATROL_CLOUD_RUN_JOB=projects/${PROJECT_ID}/locations/${_REGION}/jobs/mergepatrol-job,MERGEPATROL_POSTHOG_KEY=${_POSTHOG_KEY},MERGEPATROL_STRIPE_PRICE=${_STRIPE_PRICE}
