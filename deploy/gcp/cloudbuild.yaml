# Builds both images and deploys Mergepatrol's one environment to the GKE cluster `mergepatrol`:
# the job sandboxes' template, then the orchestrator, with deploy/gcp/deploy.sh.
# deploy/gcp/bootstrap.sh sets up what this needs.
substitutions:
  _REGION: us-west1
  _PUBLIC_URL: https://mergepatrol.ai
  # The PostHog project `mergepatrol`, in the agent-labs organization. Public: browsers send it.
  _POSTHOG_KEY: phc_kw3KfV5JfjGbGjoZ4CHDNEyE4NePf8g5c5xJsJJNDtqT
  # The live Stripe price per seat, in the product `Mergepatrol`. Not secret.
  _STRIPE_PRICE: price_1UVzi1PwOsXo1dyk78nfPqCb
  _REPO: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/mergepatrol
options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
  env: [DOCKER_BUILDKIT=1]
steps:
  - id: orchestrator
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=orchestrator
      - --tag=${_REPO}/orchestrator:${BUILD_ID}
      - .
  - id: job
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=job
      - --tag=${_REPO}/job:${BUILD_ID}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [orchestrator, job]
    args:
      - push
      - --all-tags
      - ${_REPO}/orchestrator
  - id: push-job
    name: gcr.io/cloud-builders/docker
    waitFor: [orchestrator, job]
    args:
      - push
      - --all-tags
      - ${_REPO}/job

  # The full image: it has kubectl, which the slim one does not.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push, push-job]
    entrypoint: bash
    args: [deploy/gcp/deploy.sh]
    env:
      - PROJECT=${PROJECT_ID}
      - REGION=${_REGION}
      - PUBLIC_URL=${_PUBLIC_URL}
      - JOB_IMAGE=${_REPO}/job:${BUILD_ID}
      - ORCHESTRATOR_IMAGE=${_REPO}/orchestrator:${BUILD_ID}
      - POSTHOG_KEY=${_POSTHOG_KEY}
      - STRIPE_PRICE=${_STRIPE_PRICE}
