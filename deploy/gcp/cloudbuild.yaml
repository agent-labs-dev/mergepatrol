# Builds both images and deploys MergeLoop's one environment to the GKE cluster `mergepatrol`:
# the job sandboxes' template, then the orchestrator, with deploy/gcp/deploy.sh.
# deploy/gcp/bootstrap.sh sets up what this needs.
substitutions:
  _REGION: us-west1
  _PUBLIC_URL: https://mergeloop.ai
  # The PostHog project `mergepatrol`, in the agent-labs organization. Public: browsers send it.
  _POSTHOG_KEY: phc_kw3KfV5JfjGbGjoZ4CHDNEyE4NePf8g5c5xJsJJNDtqT
  # The live Stripe price per seat, in the product `MergeLoop`. Not secret.
  _STRIPE_PRICE: price_1UVzi1PwOsXo1dyk78nfPqCb
  _REPO: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/mergepatrol
options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
steps:
  # The CLI versions npm calls latest, so the job image's CLI layer rebuilds only on a release.
  - id: cli-versions
    name: node:24-bookworm-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        claude=$$(npm view @anthropic-ai/claude-code version)
        codex=$$(npm view @openai/codex version)
        printf 'CLAUDE_CODE_VERSION=%s\nCODEX_VERSION=%s\n' "$$claude" "$$codex" | tee cli-versions.env
  # Builds and pushes both images. The docker-container builder is what can read and write the
  # layer cache in the registry.
  - id: images
    name: gcr.io/cloud-builders/docker
    waitFor: [cli-versions]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        set -a && . ./cli-versions.env && set +a
        docker buildx create --use --driver docker-container
        docker buildx bake --file deploy/gcp/docker-bake.hcl --push
    env:
      - REPO=${_REPO}
      - TAG=${BUILD_ID}

  # The full image: it has kubectl, which the slim one does not.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [images]
    entrypoint: bash
    args: [deploy/gcp/deploy.sh]
    env:
      - PROJECT=${PROJECT_ID}
      - REGION=${_REGION}
      - PUBLIC_URL=${_PUBLIC_URL}
      - JOB_IMAGE=${_REPO}/job:${BUILD_ID}
      - ORCHESTRATOR_IMAGE=${_REPO}/orchestrator:${BUILD_ID}
      - POSTHOG_KEY=${_POSTHOG_KEY}
      - STRIPE_PRICE=${_STRIPE_PRICE}
