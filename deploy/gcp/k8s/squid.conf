# The jobs' one way out: tunnels to port 443 of these hosts, which a job needs to fetch the repo,
# revoke its token, and install what the verify commands use. deploy/gcp/deploy.sh loads it
# into the ConfigMap `mergepatrol-egress`. `-n`: an IP matches no name, even with a PTR record that
# names an allowed host.
acl allowed dstdomain -n github.com api.github.com codeload.github.com
acl allowed dstdomain -n objects.githubusercontent.com raw.githubusercontent.com release-assets.githubusercontent.com
acl allowed dstdomain -n registry.npmjs.org registry.yarnpkg.com repo.yarnpkg.com nodejs.org
acl allowed dstdomain -n pypi.org files.pythonhosted.org
# The Go proxy sends large modules and toolchains to its bucket on storage.googleapis.com.
acl allowed dstdomain -n proxy.golang.org sum.golang.org storage.googleapis.com
acl allowed dstdomain -n index.crates.io static.crates.io static.rust-lang.org
acl https port 443
http_access allow CONNECT https allowed
http_access deny all
http_port 3128
cache deny all
