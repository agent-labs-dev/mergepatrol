# The jobs' one way out: tunnels to port 443 of these hosts, which a job needs to fetch the repo,
# revoke its token, and install what the verify commands use. deploy/gcp/deploy.sh loads it
# into the ConfigMap `mergepatrol-egress`.
acl allowed dstdomain github.com api.github.com codeload.github.com
acl allowed dstdomain objects.githubusercontent.com raw.githubusercontent.com release-assets.githubusercontent.com
acl allowed dstdomain registry.npmjs.org registry.yarnpkg.com repo.yarnpkg.com nodejs.org
acl allowed dstdomain pypi.org files.pythonhosted.org
acl allowed dstdomain proxy.golang.org sum.golang.org
acl allowed dstdomain index.crates.io static.crates.io static.rust-lang.org
acl https port 443
http_access allow CONNECT https allowed
http_access deny all
http_port 3128
cache deny all
