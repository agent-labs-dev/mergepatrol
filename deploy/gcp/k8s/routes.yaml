# Public routing is reconciled on every deploy, as well as on bootstrap.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mergepatrol
  namespace: mergepatrol
spec:
  parentRefs:
    - name: mergepatrol
      sectionName: https
  hostnames: [__HOST__]
  rules:
    - backendRefs:
        - name: mergepatrol
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mergepatrol-https-redirect
  namespace: mergepatrol
spec:
  parentRefs:
    - name: mergepatrol
      sectionName: http
  hostnames: [__HOST__]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
