# MergeLoop reads this file from the default branch. The dashboard opens a PR to change it.
version: 1
label: mergepatrol
batch_size: 8
agent:
  provider: anthropic
  model: claude-opus-5-5
  effort: medium
  overrides:
    review:
      provider: openai
      model: gpt-6.1-sol
verify: []
fix_ci:
  enabled: true
  attempts: 2
