services:
  mergepatrol:
    build: .
    # The dashboard has its own sign-in, but it is a spike: keep it on this machine.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - data:/data
    environment:
      MERGEPATROL_SECRET_KEY: ${MERGEPATROL_SECRET_KEY:?generate one with openssl rand -base64 32}
      MERGEPATROL_PUBLIC_URL: ${MERGEPATROL_PUBLIC_URL:-http://localhost:8080}
volumes:
  data:
