title: "feat: see which users and workspaces use the hosted Mergepatrol, in PostHog"
body: |-
  ## Summary

  Product analytics for the hosted Mergepatrol, in the new PostHog project `mergepatrol` (agent-labs org). A person is a GitHub login; a `workspace` group is an installation of the App, keyed by installation ID.

  ```diff
   login_callback
     save_workspaces
  +  analytics.signed_in          # "signed in" + $set person, $groupidentify per workspace

   queue::record(kind)
     store.record
  +  analytics.queue_event        # "pr <kind>", grouped by workspace, no person

   <App>
  +  useAnalytics(session)        # lazy-loads posthog-js, identify(login)
     <Dashboard>
  +    useWorkspaceAnalytics()    # group("workspace", installation_id)
  ```

  ```diff
   crates/
  +├── analytics/     # fire-and-forget batch capture to PostHog
   ui/src/
  +├── analytics.ts
   deploy/gcp/cloudbuild.yaml   # MERGEPATROL_POSTHOG_KEY (public project key)
  ```

  Off without `MERGEPATROL_POSTHOG_KEY`: self-hosted sends nothing, and the dashboard never downloads posthog-js (main bundle stays ~286KB, posthog-js is a separate lazy chunk).

  ## Evidence

  Nothing on screen changes.

  - `cargo clippy --workspace --all-targets -D warnings`, `cargo test --workspace`: pass, including the new `analytics` tests (off without a key; dashboard gets key and host).
  - `biome check`, `pnpm build`: pass.
  - PostHog accepts the project key (`/flags` → 200).

  ## Merge Danger

  **Door:** two-way

  Unset `MERGEPATROL_POSTHOG_KEY` and redeploy to stop sending. Events already sent stay in PostHog.

  **Blast Radius:** small

  Sends fail silently with a warning log and never block sign-in or the queue. Queue events include repo names, private ones too.

