title: "fix: a merge cut short by a restart lands as merged, not dequeued"
body: |-
  ## Summary

  A merge through the asynchronous merge API takes about 10 s, and Mergepatrol kept it only in memory. After a restart in that window, the next sync found the merged PRs closed and took them for dequeued: their labels stayed on, they got no "Merged as" comment, and the history recorded "dequeued".

  ```diff
   tick
     units = labeled PRs and stacks
  +  if lane.merging                            # a restart cut a merge short
  +    still open, labeled, same head, not held → merge again   # 409 waits for the pending one, 200 if merged
  +    otherwise → merged_as(top, head)
  +    merged → remove, "merged" exit, "Merged as" comment, labels off
     lane.sync(candidates)
   ...
   run_job / merge_batch
  +  lane.merging = { entry, PRs, top, head }; save lane
     merge
  +  rejected → clear;  finish → clear
  ```

  - `Lane.merging` is `#[serde(default)]`, so lanes saved before load as before.
  - `merged_as` moves onto the `GitHub` trait; the merged handling moves out of `finish` into `merged`, which both use.

  ## Evidence

  No screens change.

  - **Before** (the resume disabled): the new loop tests fail exactly as the issue describes.
    ```
    a_merge_that_lands_during_a_restart_is_seen_through        left: ["enqueued", "rebasing", "published", "dequeued"]
    a_stack_that_merges_during_a_restart_is_seen_through       left: ["enqueued", "rebasing", "published", "dequeued"]
    a_batch_merge_that_lands_during_a_restart_is_seen_through  left: ["enqueued", "batch", "dequeued"]
    a_merge_still_pending_after_a_restart_is_waited_for        rebased twice
    ```
    **After:** all four pass: each PR (every layer of a stack) ends `merged`, labels off, `Merged as merge-1.` commented, lane empty; a merge still pending at the restart is asked for again, not rebased again, and merges once.
  - The fake GitHub gained a merge that never answers (GitHub merges it meanwhile, or not), as a restart mid-wait leaves it.
  - `cargo fmt --check`, `cargo clippy --workspace --all-targets -- -D warnings`, `cargo test --workspace` pass. No API types changed.

  Reviewed with sol-loop: 1 round with gpt-6.1-sol. Sol verdict: approved

  ## Merge Danger

  **Door:** two-way

  Rolling back ignores the saved `merging` field and returns to the in-memory wait.

  **Blast Radius:** every merge

  Every merge now saves the lane once more before asking GitHub. Not covered: a PR unlabeled during the restart while its merge is still pending; it leaves the queue as dequeued, and GitHub may still merge it.

  Closes #52

