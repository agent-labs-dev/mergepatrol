title: "feat(api): let other apps read a PR's Mergepatrol state, with a permalink to it"
body: |-
  ## Summary

  Other apps read a PR's Mergepatrol state from Mergepatrol, instead of rebuilding it from labels, the config file and the dashboard's URL shape. First consumer: nebula's PR rows (agent-labs-dev/nebula#11439).

  ```text
  GET /api/v1/repos/{owner}/{name}/pulls/{number}       -> PullStatusView
  GET /api/v1/repos/{owner}/{name}/pulls?numbers=1,2,3  -> { pulls: PullStatusView[] }   (≤100, one repo)

  read
    Caller (auth.rs, from #136)     # session (cookie or bearer), or a GitHub token GitHub takes
    budgets.spend                   # 5,000/h per credential → x-ratelimit-*, 429 + retry-after
    caller.installation_on          # can_read → 404 "No repo o/r." (same as missing); installation or None
    v1::statuses                    # repo_state + repo_lanes + last_exits, one query each
    tagged                          # ETag, If-None-Match → 304
  ```

  ```diff
   crates/
     core/src/hold.rs        + Hold: draft | review_required | changes_requested | workflow_approval
                            +       | fork_edits_off | no_queue | no_subscription | fair_use_limit | layer{n, hold}
  -  EntryState::Held(String)
  +  EntryState::Held(Hold)  # Display keeps the old comment text; a lane saved with text reads as Waiting, next sync re-holds
     store                   + repo_state(), last_exits(), ExitQuery.pr, ExitQuery.days: Option
     web/src/auth.rs         + Caller::installation_on (None = no App); workspace_of wraps it
     web/src/routes.rs       + the two v1 routes, exempt from MCP: pull_status says the same where installed
     web/src/v1.rs           + the endpoints, ts-rs types (ui/src/api/PullStateView.ts …)
     web/src/api.rs          ~ pull_status (route and MCP tool) returns PullStateView + events
   ui/src/
     Permalink.tsx           + /$account/$repo/pull/$number
     History.tsx             + ?pr= (one PR, any time)
     App.tsx                 + no-workspace page; resume a permalink after sign-in
  ```

  Response (`mergepatrol.state`: `on` / `off` / `paused`; `override`: `on` / `off` / null):

  ```json
  {
    "repo": "acme/widgets", "number": 42,
    "url": "https://mergepatrol.ai/acme/widgets/pull/42",
    "mergepatrol": { "state": "on", "installed": true, "has_config": true, "override": null, "config_error": null },
    "queue": {
      "trunk": "main", "state": "held",
      "hold": { "reason": "draft", "layer": 6, "message": "#6 is not ready: the PR is a draft" },
      "priority": false, "position": 3, "stack": { "number": 7, "layers": [6, 7] }, "batch_pr": null
    },
    "merged": null, "ejected": null
  }
  ```

  Permalink `/{owner}/{repo}/pull/{n}` resolves client-side with the session:

  ```text
  queued                 -> /{owner}/queue?lane={owner/repo}:{trunk}&pr={n or stack}
  merged / ejected       -> /{owner}/history?repo={owner/repo}&pr={n}
  repo off               -> /{owner}/repos?repo={owner/repo}
  otherwise (open)       -> /{owner}/queue?lane=…&pr={n}&drafts=true
  no workspace for owner -> "No Mergepatrol workspace for {owner}" + Open on GitHub + Sign out
  v1 404                 -> "nothing to show you for o/r#n" + Open on GitHub
  signed out             -> landing; the permalink resumes after sign-in (sessionStorage)
  ```

  ### Outbound webhooks (design note, not built)

  - **Who registers:** a workspace admin, in the dashboard's Settings, per workspace (installation). Also `POST /api/v1/workspaces/{account}/webhooks` with a session, for apps like nebula. Not per token: a token outlives nothing we can see.
  - **Secret:** generated by Mergepatrol, shown once, sealed in the vault under `Scope::Workspace(id)` like API keys. Deliveries sign the body with HMAC-SHA256 in `x-mergepatrol-signature-256`, GitHub's format, plus a delivery ID and timestamp against replays.
  - **Events:** `pull.queued`, `pull.held` (with the `hold`), `pull.released`, `pull.running`, `pull.merged`, `pull.ejected`, `pull.dequeued`, and `repo.state_changed`. The payload is the same `PullStatusView`, so a client has one parser. They come from the queue's existing `record`/`record_exit` calls.
  - **Workspaces:** a hook sees every repo of its workspace, optionally filtered to some repos. Deliveries go out from the orchestrator through the egress proxy, retried with backoff, with a delivery log in the dashboard. A hook that keeps failing turns off.

  ## Evidence

  - `v1_says_where_each_pr_is`: held stack layer (typed hold, position, stack), running PR with its batch PR, waiting priority PR whose old ejection is ignored, merged `{sha}`, ejected `{reason}`, never-queued all null; ETag → 304; rate-limit headers.
  - `v1_says_whether_a_repo_uses_mergepatrol`: not installed → off; no file → off; override on → on; config error → paused; override off → off.
  - `v1_takes_a_github_token_or_a_session`: none → 401; session bearer and cookie → 200; budget per credential; bad `numbers` → 400.
  - `a_hold_saved_as_text_waits_until_the_next_sync_holds_it_again` (core), store `repo_state` / `last_exits` / `pr` filter.
  - `cargo test --workspace`: 402 passed. fmt, clippy, `pnpm check`, `pnpm build` clean.

  No screenshots: the new dashboard states (no-workspace page, History's "Only #n") need a signed-in GitHub session, which a local run does not have. To check after deploy: open `https://mergepatrol.ai/agent-labs-dev/mergepatrol/pull/<a merged PR>`.

  ## Merge Danger

  **Door:** two-way, with one catch on rollback

  New lanes store holds typed (`{"Held":{"kind":"draft"}}`). The old binary can't parse those, so after a rollback, any lane with a held PR fails to load until it's fixed. The way out is to roll forward, or to clear those entries' state. Going forward from today's text holds is handled: they read as waiting, and the next sync holds them again.

  **Blast Radius:** queue

  Hold reasons now flow through the whole queue (comments and events keep their text). `pull_status` (route and MCP tool) changes shape again after #136: `queue` is the v1 `QueueView` (`running`, not `active`), next to the v1 fields and `events`.

  Reviewed with sol-loop: 3 rounds with gpt-6.1-sol. Sol verdict: approved. Rebuilt on #136, then one more round: its one finding declined (pull_status is a workspace route, so a repo without the App has none to address).

