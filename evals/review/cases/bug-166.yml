title: "feat: rebrand to MergeLoop and redirect the old domain"
body: |-
  Both `mergepatrol.ai` and `mergeloop.ai` currently serve the same app. This change makes **MergeLoop** the visible product name and `https://mergeloop.ai` the canonical hosted origin. Old dashboard links receive a **302** to the same path and query on the new origin, through a Cloudflare redirect rule; existing HTTPS API, MCP and webhook endpoints continue serving requests directly.

  The dashboard, public docs/blog/compare/changelog, metadata and social artwork, GitHub review copy, agent skill and macOS menu bar app use the new name. Installed config and skill paths, labels, API fields, package/binary names, stored identifiers, GCP resources, bundle/Keychain IDs and rolling download URLs retain their compatibility names. Existing review-answer markers remain unchanged in hidden comments so older deliveries and rolling revisions still recognize them.

  Gateway HTTPRoutes are now reconciled by the normal deploy, after the app rolls out. The Gateway keeps serving `mergepatrol.ai` unchanged; the page redirect is a Cloudflare rule in that zone, turned on after the deploy, which also needs the zone's proxy on and SSL set to Full (strict). Details and live verification commands are in `deploy/gcp/rebrand.md`.

  ### Cutover prerequisite — do not queue yet

  Before deploying, an owner must add `https://mergeloop.ai/auth/callback` to the **existing** `merge-patrol` GitHub App, keeping the old callback during rollout, and rename it to MergeLoop so the rollout reads the new slug. After the deploy, update its setup URL to `https://mergeloop.ai/setup/installed` and homepage to `https://mergeloop.ai`, preserving its App ID and installations.

  The GitHub App and Stripe product/receipt/portal branding also need their owner settings updated; this repository sends no outbound email itself. Keep existing Stripe IDs and subscriptions. The machine's GCP reader identity received 403 for `container.clusters.get` on project `mergepatrol`, so cluster inspection and live route application were unavailable here. The normal deployment uses its existing Cloud Build identity.

  ### Validation

  - Rust formatting and `cargo clippy --workspace --all-targets --locked -- -D warnings` pass.
  - UI Biome checks, TypeScript checking and production build pass; tray formatting passes. The macOS build runs in CI.
  - Deployment shell syntax and YAML parsing pass. Both generated social cards were inspected.
  - Only lint/type/build checks were run locally, per repository instructions; CI runs the full suite. No tests were added for copy or constants. Existing tests cover metadata assets, MCP initialization, skill-copy parity and review-answer recognition.
  - Baseline evidence: both origins return 200; `/auth/login` on the new origin still returns the old-domain callback. After deployment, verify 302 + path/query preservation, successful GitHub sign-in/install return, direct old API/MCP access and a signed webhook delivery.

  Hold this PR out of the merge queue until the callback prerequisite is confirmed. Production redirect/sign-in verification and external branding remain outstanding.

