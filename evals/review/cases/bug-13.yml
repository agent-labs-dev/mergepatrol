head: 2938ef475556776220c1a11b900529914a6ac4c2
title: "feat: start queued work within a second of a GitHub change, not on the next poll"
body: |-
  ## Summary

  GitHub webhooks wake a repo's queue as soon as something changes, rather than on the next poll. A webhook is only a wake-up: the queue still reads state from GitHub, as it does when it polls. A lost delivery costs time, not state.

  ```mermaid
  sequenceDiagram
      participant GH as GitHub
      participant W as POST /webhooks/github
      participant Q as Repo queue
      GH->>W: event + X-Hub-Signature-256
      W->>W: HMAC check against the App's webhook secret
      W->>Q: wake(installation, repo)
      Q->>GH: read the lane and the PR (as on a poll)
  ```

  ```diff
   run_repo
     loop
       tick
  -    sleep(poll)
  +    wait(poll) or until a webhook for this repo

   run_job, waiting for checks
  -  sleep(15s)
  +  wait(15s) or until a webhook for this repo
  ```

  - **Manifest:** new Apps get `hook_attributes` (`<public URL>/webhooks/github`, active only on https) and `default_events`: `pull_request`, `pull_request_review`, `push`, `check_suite`, `check_run`, `status`. GitHub generates the secret, which we already store.
  - **Hosted:** optional `MERGEPATROL_GITHUB_WEBHOOK_SECRET`. Without it, the route returns 404 and the queue only polls.
  - **Localhost:** no webhooks, polling as before. The README shows how to get them through a `cloudflared` tunnel.
  - An App created before this has no webhook. Create it again to get one.

  ## Evidence

  Nothing changes on screen. Run live on this repo: a new App created through a `cloudflared` tunnel, with the poll set to 600s so that only a webhook could react in time.

  - **Before:** label → `enqueued` takes up to one poll. #4 started 63s after #3 merged.
    **After:** #11 labeled at 00:38:51.9, `enqueued` at 00:38:52.7, merged at 00:39:03. #12, same: under a second to `enqueued`.
  - **Tests:**
    ```text
    a_signed_webhook_wakes_its_repo                         → 204, wakes (7, "o/r")
    a_badly_signed_webhook_wakes_nothing                    → 401 for a wrong or missing signature
    without_a_webhook_secret_webhooks_are_off               → 404
    a_webhook_cuts_the_wait_short_even_when_it_came_first   → wait returns at once; another repo's webhook does not count
    ```
    Full `cargo test` is green, DB tests included.

  ## Merge Danger

  **Door:** two-way

  **Blast Radius:** queue

  The new route is unauthenticated apart from the HMAC, and all it can do is make a repo's queue tick early. A forged or replayed delivery costs, at most, an extra read from GitHub. Wakes are coalesced into one permit per repo, so a burst of deliveries is one tick.

