title: "feat(pulls): publish a draft PR from the dashboard, and make close red"
body: |-
  ## What and why

  Two gaps in the dashboard's PR actions:

  - **No way to publish a draft.** A draft now has a **Publish** button in the You tab's **Drafts** folder and beside **Queue** in the queue page's PR pane (also for a queued PR the queue holds as a draft). It marks the PR ready for review on GitHub as the user, via GraphQL `markPullRequestReadyForReview` (REST has no endpoint for it). A PR that is already ready is left as it is. The You tab drops it from Drafts at once, and the queue, which holds drafts, wakes to read it again instead of waiting for the webhook.
  - **The close button didn't read as close.** It was a grey icon like the others. It is now red-tinted, with a red hover. On the queue page it moves out of the list rows and onto the PR's pane, beside **Queue**, so it is only reachable from a PR you have open; the rows keep just priority and queue/remove. In the You tab it was already in the PR's pane. Its confirm step (queue page) and five-second Undo (You tab) are unchanged.

  API and MCP: new route `POST /api/w/{id}/repos/{owner}/{name}/pulls/{number}/ready` with tool `ready_pull` (listed in the README). GitHub decides who may publish: write access, or being the PR's author. A refusal comes back as a 403 the dashboard shows.

  ## Screenshots

  Captured from the dashboard built from `origin/main` (before) and this branch (after), with the API stubbed.

  | | Before | After |
  | --- | --- | --- |
  | Queue page | ![before](https://raw.githubusercontent.com/agent-labs-dev/mergepatrol/pr-assets/publish-draft/pr-assets/publish-draft/queue-before.png) | ![after](https://raw.githubusercontent.com/agent-labs-dev/mergepatrol/pr-assets/publish-draft/pr-assets/publish-draft/queue-after.png) |
  | Queue page, open PR (close in the pane, not the rows) | — | ![after](https://raw.githubusercontent.com/agent-labs-dev/mergepatrol/pr-assets/publish-draft/pr-assets/publish-draft/queue-after-open.png) |
  | You tab, Drafts | ![before](https://raw.githubusercontent.com/agent-labs-dev/mergepatrol/pr-assets/publish-draft/pr-assets/publish-draft/you-before.png) | ![after](https://raw.githubusercontent.com/agent-labs-dev/mergepatrol/pr-assets/publish-draft/pr-assets/publish-draft/you-after.png) |

  ## How you checked it

  - [x] `cargo fmt --all --check`, `cargo clippy --workspace --all-targets -- -D warnings` and `(cd ui && pnpm check)` pass
  - [x] `cargo test` for store, github, web and mergepatrol passes, including new tests: `inbox_ready` clears a draft only on an open PR; publishing marks the queue's read stale and wakes it; GraphQL `FORBIDDEN` maps to `Refused`. No API types changed.
  - [x] The README lists `ready_pull`
  - [x] A changelog entry in `content/changelog/`
  - [ ] `crates/github/tests/ready_live.rs` (ignored, needs a real draft and token) was not run

