# Checks every PR and every push to main: the dashboard, then the Rust workspace, which embeds it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      # The dev Postgres from compose.dev.yml, at the DATABASE_URL in .cargo/config.toml.
      postgres:
        image: postgres:17-alpine
        ports: ["54329:5432"]
        env:
          POSTGRES_USER: mergepatrol
          POSTGRES_PASSWORD: mergepatrol
          POSTGRES_DB: mergepatrol
        options: >-
          --health-cmd "pg_isready -U mergepatrol" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: ui
        working-directory: ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # `cargo test` regenerates the API types in ui/src/api. A diff means they were not committed.
      - run: git diff --exit-code ui/src/api
