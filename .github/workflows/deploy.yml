# Deploys main to GCP: builds both images and rolls out the job and the orchestrator.
# deploy/gcp/bootstrap.sh sets up the identity this signs in as.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces one still waiting.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: mergepatrol
          workload_identity_provider: projects/54240448690/locations/global/workloadIdentityPools/github/providers/github
          service_account: mergepatrol-deploy@mergepatrol.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: >-
          gcloud builds submit --region=us-west1 --config=deploy/gcp/cloudbuild.yaml
          --substitutions=_REGION=us-west1,_PUBLIC_URL=https://mergepatrol.ai .
