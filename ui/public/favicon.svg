<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Mergepatrol</title>
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2140"/>
      <stop offset="1" stop-color="#0a0d1a"/>
    </linearGradient>
    <linearGradient id="mp-violet" gradientUnits="userSpaceOnUse" x1="0" y1="37" x2="0" y2="219">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="mp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#mp-bg)"/>
  <circle cx="128" cy="136" r="96" fill="url(#mp-glow)"/>
  <!-- logo.svg on a 5 by 5 grid, which stays legible at 16px. -->
  <g fill="url(#mp-violet)">
    <rect x="113" y="37" width="30" height="30" rx="5"/>
    <rect x="75" y="75" width="30" height="30" rx="5"/>
    <rect x="113" y="75" width="30" height="30" rx="5"/>
    <rect x="151" y="75" width="30" height="30" rx="5"/>
    <rect x="113" y="113" width="30" height="30" rx="5"/>
    <rect x="75" y="151" width="30" height="30" rx="5"/>
    <rect x="151" y="151" width="30" height="30" rx="5"/>
    <rect x="37" y="189" width="30" height="30" rx="5"/>
    <rect x="189" y="189" width="30" height="30" rx="5"/>
  </g>
</svg>
