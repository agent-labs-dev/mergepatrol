<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>MergeLoop logo</title>
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2140"/>
      <stop offset="1" stop-color="#0a0d1a"/>
    </linearGradient>
    <linearGradient id="mp-violet" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="216">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="mp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#mp-bg)"/>
  <circle cx="128" cy="136" r="96" fill="url(#mp-glow)"/>
  <!-- The merge: two branches join into one trunk, under an arrowhead. -->
  <g fill="url(#mp-violet)">
    <rect x="118" y="40" width="20" height="20" rx="3.5"/>
    <rect x="92" y="66" width="20" height="20" rx="3.5"/>
    <rect x="118" y="66" width="20" height="20" rx="3.5"/>
    <rect x="144" y="66" width="20" height="20" rx="3.5"/>
    <rect x="66" y="92" width="20" height="20" rx="3.5"/>
    <rect x="92" y="92" width="20" height="20" rx="3.5"/>
    <rect x="118" y="92" width="20" height="20" rx="3.5"/>
    <rect x="144" y="92" width="20" height="20" rx="3.5"/>
    <rect x="170" y="92" width="20" height="20" rx="3.5"/>
    <rect x="118" y="118" width="20" height="20" rx="3.5"/>
    <rect x="92" y="144" width="20" height="20" rx="3.5"/>
    <rect x="144" y="144" width="20" height="20" rx="3.5"/>
    <rect x="66" y="170" width="20" height="20" rx="3.5"/>
    <rect x="170" y="170" width="20" height="20" rx="3.5"/>
    <rect x="40" y="196" width="20" height="20" rx="3.5"/>
    <rect x="196" y="196" width="20" height="20" rx="3.5"/>
  </g>
</svg>
