<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Mergepatrol GitHub App icon</title>
  <!-- favicon.svg, full bleed on a flat ground: GitHub crops it to a circle on its badge color. -->
  <defs>
    <linearGradient id="mp-violet" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="240">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="#141831"/>
  <g fill="url(#mp-violet)">
    <rect x="108" y="16" width="40" height="40" rx="7"/>
    <rect x="62" y="62" width="40" height="40" rx="7"/>
    <rect x="108" y="62" width="40" height="40" rx="7"/>
    <rect x="154" y="62" width="40" height="40" rx="7"/>
    <rect x="108" y="108" width="40" height="40" rx="7"/>
    <rect x="62" y="154" width="40" height="40" rx="7"/>
    <rect x="154" y="154" width="40" height="40" rx="7"/>
    <rect x="16" y="200" width="40" height="40" rx="7"/>
    <rect x="200" y="200" width="40" height="40" rx="7"/>
  </g>
</svg>
