# The menu bar app: macOS on Apple silicon only. Its own workspace, so the server's CI, on
# Linux, never builds GPUI.
[package]
name = "mergepatrol-tray"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
env_logger = "0.11"
futures = "0.3"
getrandom = "0.3"
# Pinned with jnsdls/slopify, the app this one's shell comes from.
gpui = { git = "https://github.com/zed-industries/zed", rev = "76659a55a8c10ed355a070f8764a0b1733e3c115" }
# runtime_shaders compiles the Metal shaders at launch, so building needs no Metal Toolchain.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "76659a55a8c10ed355a070f8764a0b1733e3c115", features = ["font-kit", "runtime_shaders"] }
jiff = "0.2"
log = "0.4"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
