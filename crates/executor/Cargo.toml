[package]
name = "mergepatrol-executor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
mergepatrol-core = { version = "0.1.0", path = "../core" }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
secrecy = "0.10.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "test-util"] }
