[package]
name = "mergepatrol-github"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
mergepatrol-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"

[features]
# A scripted GitHub on localhost, for the tests of the crates that use this one.
testing = ["tokio/io-util", "tokio/net"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt"] }
