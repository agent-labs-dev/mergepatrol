[package]
name = "mergepatrol-github"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
mergepatrol-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
