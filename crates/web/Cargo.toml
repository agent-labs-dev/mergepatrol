[package]
name = "mergepatrol-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13"
mergepatrol-analytics = { version = "0.1.0", path = "../analytics" }
mergepatrol-billing = { version = "0.1.0", path = "../billing" }
mergepatrol-core = { version = "0.1.0", path = "../core" }
mergepatrol-github = { version = "0.1.0", path = "../github" }
mergepatrol-resolver = { version = "0.1.0", path = "../resolver" }
mergepatrol-store = { version = "0.1.0", path = "../store" }
mime_guess = "2.0.5"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rust-embed = "8.13.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net"] }
tracing = "0.1.44"
ts-rs = "12.0.1"

[dev-dependencies]
mergepatrol-resolver = { path = "../resolver", features = ["testing"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
