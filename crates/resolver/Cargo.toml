[package]
name = "mergepatrol-resolver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
mergepatrol-executor = { version = "0.1.0", path = "../executor" }
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "fs", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
