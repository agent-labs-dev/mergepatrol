[package]
name = "mergepatrol-resolver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
mergepatrol-core = { version = "0.1.0", path = "../core" }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "fs", "rt"] }
tracing = "0.1.44"

[features]
# A stand-in for OpenAI's sign-in, for tests.
testing = ["dep:axum"]

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
