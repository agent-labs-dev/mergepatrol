[package]
name = "mergepatrol-billing"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
hmac = "0.13"
mergepatrol-store = { version = "0.1.0", path = "../store" }
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
