[package]
name = "mergepatrol-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "review-eval"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
mergepatrol-core = { version = "0.1.0", path = "../core" }
mergepatrol-executor = { version = "0.1.0", path = "../executor" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
