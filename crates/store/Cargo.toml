[package]
name = "mergepatrol-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
mergepatrol-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
