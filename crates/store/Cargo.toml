[package]
name = "mergepatrol-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
mergepatrol-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "json"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
