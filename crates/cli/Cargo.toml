[package]
name = "mergeloop-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The mergeloop command: an agent lands a PR through MergeLoop's queue."

[[bin]]
name = "mergeloop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
