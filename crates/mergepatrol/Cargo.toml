[package]
name = "mergepatrol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
mergepatrol-analytics = { version = "0.1.0", path = "../analytics" }
mergepatrol-billing = { version = "0.1.0", path = "../billing" }
mergepatrol-core = { version = "0.1.0", path = "../core" }
mergepatrol-executor = { version = "0.1.0", path = "../executor" }
mergepatrol-git = { version = "0.1.0", path = "../git" }
mergepatrol-github = { version = "0.1.0", path = "../github" }
mergepatrol-resolver = { version = "0.1.0", path = "../resolver" }
mergepatrol-store = { version = "0.1.0", path = "../store" }
mergepatrol-web = { version = "0.1.0", path = "../web" }
reqwest = "0.13.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
mergepatrol-github = { path = "../github", features = ["testing"] }
mergepatrol-executor = { path = "../executor" }
mergepatrol-resolver = { path = "../resolver", features = ["testing"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
